[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudlens"
version = "0.1.0"
description = "Real-time, explainable card fraud detection system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Begüm Uzun" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "streamlit>=1.45",
    "altair>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
fraudlens-generate = "fraudlens.data.generator:main"
fraudlens-features = "fraudlens.features.batch:main"
fraudlens-train = "fraudlens.model.train:main"
fraudlens-explain = "fraudlens.explain.cli:main"
fraudlens-app = "fraudlens.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The stylesheet and HTML snippets read better on one line each.
"src/fraudlens/app/theme.py" = ["E501"]
